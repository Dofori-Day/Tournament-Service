# --- MySQL ---
mysql.datasource.jdbc-url=${MYSQL_JDBC_URL:jdbc:mysql://mysql:3307/tournament}
mysql.datasource.username=${MYSQL_USERNAME:root}
mysql.datasource.password=${MYSQL_PASSWORD:}
mysql.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mysql.datasource.maximum-pool-size=${MYSQL_MAX_POOL_SIZE:10}
mysql.datasource.minimum-idle=${MYSQL_MIN_IDLE:2}
mysql.datasource.idle-timeout=30000
mysql.datasource.max-lifetime=1800000

# --- PostgreSQL ---
postgres.datasource.jdbc-url=${POSTGRES_JDBC_URL:jdbc:postgresql://postgres:5432/tournament}
postgres.datasource.username=${POSTGRES_USERNAME:postgres}
postgres.datasource.password=${POSTGRES_PASSWORD:}
postgres.datasource.driver-class-name=org.postgresql.Driver
postgres.datasource.maximum-pool-size=${POSTGRES_MAX_POOL_SIZE:10}
postgres.datasource.minimum-idle=${POSTGRES_MIN_IDLE:2}
postgres.datasource.idle-timeout=30000
postgres.datasource.max-lifetime=1800000

spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin}
spring.security.user.roles=ADMIN

jwt.secret=${JWT_SECRET:mysecretkey1234567890}
jwt.expiration=${JWT_EXPIRATION:3600000}